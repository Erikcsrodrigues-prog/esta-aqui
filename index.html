<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css.principal/normalize.css">
    <link rel="stylesheet" href="css.principal/parte-cadastro_1.css">
</head>
<body style="background-image: url('imagens/imagem_projeto.jpg');">
    
    <div class="login-card">

        <h1 class="titulo-login">Login</h1>

        <form action="pagina_index.html" method="get">

            <div class="campo">
                <label for="username">Nome de usuário</label>
                <input type="text"
                       id="username"
                       name="username"
                       required>
            </div>

            <div class="campo">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    pattern="[0-9]{4,}"
                    title="Digite apenas números (mínimo 4 dígitos)"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                    required>
            </div>

            <div> 
            <label class="label" for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos e condições
            </label>
            </div>

            <input
                type="submit"
                value="Entrar"
                class="btn-submit">
            <div>

            <p class="p">
                <a class="link" href="index2.html">Cadastre-se</a>
            </p>

            </div>
        </form>
    </div> 

</body>
</html>
