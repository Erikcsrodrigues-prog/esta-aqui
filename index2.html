<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="css.principal/normalize.css">
    <link rel="stylesheet" href="css.principal/index2.css">
</head>
<body style="background-image: url('imagens/imagem_projeto.jpg');">
    
    <div class="cadastro-card">

        <div class="cartao-postal">
            <h2>Bem-vindo ao site!</h2>
            <p>Por favor, preencha o formulário abaixo para criar sua conta!</p>
        </div>

            <h1>Cadastre-se</h1>

            <form action="index3.html" method="get">

                <div class="campo">
                    <label for="username">Nome de usuário:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="campo">
                    <label for="data">Data de nascimento:</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="password">Senha:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        pattern="[0-9]{4,}"
                        title="Digite apenas números (mínimo 4 dígitos)"
                        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                        required>
                </div>

                <div class="botao-entrar">
                    <button type="submit" class="btn-submit">Entrar</button>
                </div>

                <div class="voltar-link">
                    <a href="index.html" class="btn-link">Já tem uma conta? Clique aqui</a>
                </div>

            </form>
    </div>

</body>
</html>
